name: Credential health

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  ticktick-expiry:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check TickTick token lifetime
        env:
          TICKTICK_TOKEN_EXPIRES_AT: ${{ vars.TICKTICK_TOKEN_EXPIRES_AT }}
        run: |
          node --input-type=module <<'NODE'
          const expiresAt = Date.parse(process.env.TICKTICK_TOKEN_EXPIRES_AT ?? "");
          if (!Number.isFinite(expiresAt)) {
            console.error("::error::TICKTICK_TOKEN_EXPIRES_AT is missing or invalid");
            process.exit(1);
          }
          const days = (expiresAt - Date.now()) / 86_400_000;
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_STEP_SUMMARY, `## TickTick token\n\n${days.toFixed(1)} days remaining.\n`),
          );
          if (days <= 14) {
            console.error(`::error::TickTick token expires in ${days.toFixed(1)} days; reauthorize now`);
            process.exit(1);
          }
          if (days <= 30) console.warn(`::warning::TickTick token expires in ${days.toFixed(1)} days`);
          NODE
